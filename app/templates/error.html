<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('favicon') }}">
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
  </head>
  <body class="login-body">
    <div class="login-shell">
      <section class="login-card panel">
        <div class="eyebrow">Помилка</div>
        <h1>{{ title }}</h1>
        <p class="page-summary">{{ message }}</p>
        <div class="header-actions">
          <a class="btn btn-primary" href="{{ url_for('dashboard') }}">Повернутися на dashboard</a>
          <a class="btn btn-secondary" href="{{ url_for('login') }}">На сторінку входу</a>
        </div>
      </section>
    </div>
  </body>
</html>
