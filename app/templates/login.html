<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вхід | Retail Demand AI</title>
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
  </head>
  <body class="login-body">
    <main class="login-card">
      <div class="brand login-brand">
        <span class="brand-mark">AI</span>
        <div>
          <strong>Retail Demand</strong>
          <small>Forecasting System</small>
        </div>
      </div>
      <h1>Вхід менеджера</h1>
      <p>Демонстраційний санкціонований доступ для дипломного прототипу.</p>
      {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
      {% endif %}
      <form method="post">
        <label class="form-label">Логін</label>
        <input class="form-control" name="username" value="admin" required>
        <label class="form-label mt-3">Пароль</label>
        <input class="form-control" type="password" name="password" value="admin123" required>
        <button class="btn btn-primary w-100 mt-4" type="submit">Увійти</button>
      </form>
      <div class="demo-access">Демо: admin / admin123</div>
    </main>
  </body>
</html>
