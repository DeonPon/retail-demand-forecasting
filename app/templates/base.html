<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Retail Demand AI{% endblock %}</title>
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">AI</span>
          <div>
            <strong>Retail Demand</strong>
            <small>Forecasting System</small>
          </div>
        </div>
        <nav class="nav-menu">
          <a href="{{ url_for('dashboard') }}">Dashboard</a>
          <a href="{{ url_for('products_page') }}">Товари</a>
          <a href="{{ url_for('forecast_page') }}">Прогноз</a>
          <a href="{{ url_for('recommendations_page') }}">Закупівлі</a>
          <a href="{{ url_for('metrics_page') }}">Метрики</a>
          <a href="{{ url_for('about_page') }}">Про систему</a>
        </nav>
        <div class="sidebar-footer">
          <span>{{ session.get('user', {}).get('username', 'manager') }}</span>
          <a href="{{ url_for('logout') }}">Вийти</a>
        </div>
      </aside>

      <main class="main-content">
        {% block content %}{% endblock %}
      </main>
    </div>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}" defer></script>
  </body>
</html>
